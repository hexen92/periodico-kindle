name: Generar portada

on:
  schedule:
    # 9:00 y 21:00 UTC = 6:00 y 18:00 en Chile (horario de verano; en invierno queda 5:00 y 17:00).
    # GitHub puede atrasarse unos minutos en ejecutarlo.
    - cron: "0 9,21 * * *"
  workflow_dispatch:   # botón "Run workflow" para generarla cuando quieras

permissions:
  contents: write

concurrency:
  group: portada
  cancel-in-progress: true

jobs:
  portada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright pillow tzdata
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-dejavu-core fonts-noto-color-emoji

      - name: Revisar fuentes de noticias
        continue-on-error: true
        run: python periodico.py --probar

      - name: Generar portada y libro
        run: python periodico.py --una-vez

      - name: Publicar en GitHub Pages
        run: |
          mkdir publicar
          cp salida/portada.png salida/portada.html publicar/
          if [ -f salida/periodico.epub ]; then cp salida/periodico.epub publicar/; fi
          touch publicar/.nojekyll
          cat > publicar/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>La Portada</title><body style="margin:0;background:#fff">
          <p style="text-align:center;font:16px serif"><a href="periodico.epub">Descargar el libro (EPUB)</a></p>
          <img src="portada.png" style="width:100%;max-width:800px;display:block;margin:auto">
          HTML
          cd publicar
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Portada $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
